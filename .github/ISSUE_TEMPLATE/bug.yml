name: Bug report
description: Report a defect in Haven Vault.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe the defect. Do not include passphrases, credentials, private files, deployment logs, or exploit details. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before this happened?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local fictional demo (?demo=1)
        - Local Firebase emulators
        - Self-hosted Firebase project
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit, release, or "main" if you are not sure.
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report does not include secrets or a vulnerability. I will report security issues privately as described in SECURITY.md.
          required: true
