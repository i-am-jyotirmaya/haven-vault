name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix functions ci
      - run: pnpm test
        # Exercise test collection with deployment configuration present, as on
        # a developer machine with .env.local. All values below are fictional.
        env:
          VITE_FIREBASE_API_KEY: example-key
          VITE_FIREBASE_AUTH_DOMAIN: example-vault.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: example-vault
          VITE_FIREBASE_STORAGE_BUCKET: example-vault.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: '1:123456789012:web:example'
          VITE_VAULT_BACKEND_READY: 'true'
      - run: pnpm test:config
      - run: pnpm test:backend
      - run: pnpm test:local
      - run: pnpm build
